version: "2"

run:
  build-tags:
    - integration

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    staticcheck:
      checks:
        - all
        # A doc comment on every package conflicts with keeping comments
        # for the why; most packages here need none.
        - -ST1000

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/redbackthomson/nix-tasks
